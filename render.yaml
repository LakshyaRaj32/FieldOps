# Render Blueprint Specification (https://render.com/docs/blueprint-spec)
# Deploys FieldOps API backend as a Docker container connecting to Supabase PostgreSQL.

services:
  # Render Key Value (Redis-compatible): cache and shared rate-limit counters only.
  # The free plan has no persistence, which is fine: everything in it is rebuildable.
  - type: keyvalue
    name: fieldops-redis
    plan: free
    region: oregon # Must match the web service's region (private network).
    maxmemoryPolicy: volatile-lru # Every key has a TTL; evict the least recently used.
    ipAllowList: [] # Private network only: no access from the internet.

  - type: web
    name: fieldops-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon # Options: oregon, frankfurt, singapore, ohio
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0

      # Supabase PostgreSQL connection string.
      # Set in the Render dashboard:
      # Format: postgresql://postgres:[PASSWORD]@db.[PROJECT-REF].supabase.co:5432/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Render automatically generates high-entropy random secrets on service creation
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: ACCESS_TOKEN_EXPIRATION
        value: 15m
      - key: REFRESH_TOKEN_EXPIRATION
        value: 30d
      - key: SWAGGER_ENABLED
        value: "false"

      # Automatically executes pending Prisma migrations on container startup
      - key: RUN_MIGRATIONS
        value: "true"

      - key: OVERDUE_SCAN_INTERVAL
        value: 1h

      # Local disk storage directory for uploaded evidence
      - key: STORAGE_DIR
        value: ./storage

      # CORS origins (comma-separated, leave empty or add frontend domain if web client is introduced)
      - key: CORS_ORIGINS
        value: ""

      # Internal connection string of the Key Value instance above.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fieldops-redis
          property: connectionString

      # Render's load balancer sits in front of the service: read the client IP from
      # X-Forwarded-For through one hop (rate limits are per client IP for sign-in).
      - key: TRUST_PROXY
        value: 1

      # Background tasks (push delivery, overdue scan, purges) run in this process on the
      # free plan. Set to false here if a separate worker service is added later.
      - key: WORKERS_ENABLED
        value: "true"

